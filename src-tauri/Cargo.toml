[package]
name = "hub"
version = "0.0.1"
description = "Personal daily workflow hub backed by markdown files"
edition = "2021"

[lib]
name = "hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

[profile.release]
lto = true
opt-level = "s"
strip = true
